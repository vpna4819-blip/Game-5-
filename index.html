<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WASM Engine Proxy - Adaptive Performance</title>

  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; overflow: hidden; touch-action: none; }
    canvas#canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    
    /* Touch UI Overlay */
    #touch-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; user-select: none; }
    
    /* Left: Movement Joystick */
    #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
    #joystick-nub { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); transition: transform 0.05s ease-out; }
    
    /* Right: Camera Swipe Area */
    #camera-zone { position: absolute; top: 0; right: 0; width: 50%; height: 60%; pointer-events: auto; }
    
    /* Right: Action Buttons */
    #action-buttons { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; pointer-events: auto; }
    .action-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: white; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .action-btn:active { background: rgba(255,255,255,0.5); }
    
    /* PWA Fullscreen Toggle */
    #fs-btn { position: absolute; top: 15px; right: 15px; padding: 10px 15px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #fff; pointer-events: auto; z-index: 10000; border-radius: 8px; }
  </style>
</head>
<body>

  <button id="fs-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <div id="touch-ui">
    <div id="joystick-zone"><div id="joystick-nub"></div></div>
    <div id="camera-zone"></div>
    <div id="action-buttons">
      <div class="action-btn" id="btn-jump">JUMP</div>
      <div class="action-btn" id="btn-enter">ENTER</div>
      <div class="action-btn" id="btn-sprint">RUN</div>
      <div class="action-btn" id="btn-action">ACT</div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // 1. DEVICE TIER DETECTION & ADAPTIVE CONFIGURATION
    // ------------------------------------------------------------------
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    const ram = navigator.deviceMemory || 4; 
    const cores = navigator.hardwareConcurrency || 4;
    
    // Determine Hardware Tier for OOM prevention
    const isLowEnd = isMobile && (ram <= 4 || cores <= 4);
    let currentScale = isMobile ? (isLowEnd ? 0.5 : 0.7) : 1.0;
    const targetFPS = isMobile ? (isLowEnd ? 30 : 60) : 60;

    // Notice: navigator.hardwareConcurrency clamping was REMOVED here. 
    // Allowing the browser to freely allocate threads fixes the 78% loading pthread deadlock.

    // ------------------------------------------------------------------
    // 2. WEBGL INTERCEPTOR (Forced Optimizations)
    // ------------------------------------------------------------------
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, options) {
      if (options === undefined) options = {};
      
      if (type === 'webgl' || type === 'webgl2') {
        options.powerPreference = 'high-performance';
        options.desynchronized = true;
        options.antialias = false; 
        
        if (isLowEnd) {
          options.alpha = false;
          options.depth = false; 
          options.stencil = false;
        }
      }
      return originalGetContext.call(this, type, options);
    };

    // ------------------------------------------------------------------
    // 3. ENGINE CONFIGURATION (Emscripten hooks + instantiateStreaming)
    // ------------------------------------------------------------------
    window.Module = {
      canvas: document.getElementById('canvas'),
      arguments: isMobile ? [
        `-lowMemory=${isLowEnd ? 'true' : 'false'}`,
        `-frameLimit=${targetFPS}`,
        `-shadowQuality=${isLowEnd ? '-1' : '0'}`,
        `-lodScale=${isLowEnd ? '0.5' : '0.8'}`
      ] : [],
      preRun: [function() {
        if (isMobile) window.devicePixelRatio = currentScale;
      }],
      // Enforce parallel WebAssembly streaming compilation during download
      instantiateWasm: function(imports, successCallback) {
        // Resolve the exact binary file name depending on the upstream engine setup
        const wasmUrl = (typeof Module.locateFile === 'function') 
          ? Module.locateFile('game_engine.wasm') 
          : (Module.wasmBinaryFile || 'game_engine.wasm');

        WebAssembly.instantiateStreaming(fetch(wasmUrl), imports)
          .then(function(output) {
            successCallback(output.instance);
          })
          .catch(function(err) {
            console.warn("[WASM] Streaming compilation failed, falling back to ArrayBuffer...", err);
            fetch(wasmUrl)
              .then(res => res.arrayBuffer())
              .then(buf => WebAssembly.instantiate(buf, imports))
              .then(output => successCallback(output.instance))
              .catch(fallbackErr => console.error("[WASM] Fallback failed:", fallbackErr));
          });
        return {}; // Tell the engine loader to wait asynchronously
      }
    };

    // ------------------------------------------------------------------
    // 4. DYNAMIC FPS THROTTLER (Frame Dropping Protection)
    // ------------------------------------------------------------------
    if (isMobile) {
      let frameCount = 0;
      let lastCheckTime = performance.now();
      const checkIntervalMs = 3000; 
      
      function monitorDynamicPerformance() {
        frameCount++;
        const now = performance.now();
        const elapsed = now - lastCheckTime;
        
        if (elapsed >= checkIntervalMs) {
          const avgFps = (frameCount / elapsed) * 1000;
          
          if (avgFps < 24 && currentScale > 0.2) {
            currentScale = Math.max(currentScale * 0.90, 0.2); 
            window.devicePixelRatio = currentScale;
            window.dispatchEvent(new Event('resize'));
            console.warn(`[Auto-Optimization] Dropped to ${avgFps.toFixed(1)} FPS. Downscaling canvas to ${currentScale.toFixed(2)}x`);
          }
          
          frameCount = 0;
          lastCheckTime = now;
        }
        requestAnimationFrame(monitorDynamicPerformance);
      }
      requestAnimationFrame(monitorDynamicPerformance);
    }

    // ------------------------------------------------------------------
    // 5. MOBILE TOUCH CONTROLS LOGIC
    // ------------------------------------------------------------------
    if (isMobile) {
      document.getElementById('touch-ui').style.display = 'block';

      function dispatchKey(type, code, key, keyCode) {
        window.dispatchEvent(new KeyboardEvent(type, { code: code, key: key, keyCode: keyCode, bubbles: true, cancelable: true }));
      }

      const bindButton = (id, code, key, keyCode) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); dispatchKey('keydown', code, key, keyCode); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); dispatchKey('keyup', code, key, keyCode); });
      };

      bindButton('btn-jump', 'Space', ' ', 32);
      bindButton('btn-enter', 'Enter', 'Enter', 13);
      bindButton('btn-sprint', 'ShiftLeft', 'Shift', 16);
      bindButton('btn-action', 'KeyF', 'f', 70);

      const joyZone = document.getElementById('joystick-zone');
      const joyNub = document.getElementById('joystick-nub');
      let joyCenter = { x: 0, y: 0 };
      let activeKeys = new Set();

      joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = joyZone.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        handleJoyMove(e.touches[0]);
      });

      joyZone.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoyMove(e.touches[0]); });
      
      joyZone.addEventListener('touchend', (e) => {
        e.preventDefault();
        joyNub.style.transform = `translate(-50%, -50%)`;
        ['KeyW', 'KeyA', 'KeyS', 'KeyD'].forEach(k => {
          if (activeKeys.has(k)) { dispatchKey('keyup', k, '', 0); activeKeys.delete(k); }
        });
      });

      function handleJoyMove(touch) {
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        const maxDist = 40; 
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        joyNub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

        const threshold = 15;
        const keysToPress = new Set();
        if (dy < -threshold) keysToPress.add('KeyW');
        if (dy > threshold) keysToPress.add('KeyS');
        if (dx < -threshold) keysToPress.add('KeyA');
        if (dx > threshold) keysToPress.add('KeyD');

        ['KeyW', 'KeyA', 'KeyS', 'KeyD'].forEach(k => {
          if (keysToPress.has(k) && !activeKeys.has(k)) { dispatchKey('keydown', k, '', 0); activeKeys.add(k); }
          else if (!keysToPress.has(k) && activeKeys.has(k)) { dispatchKey('keyup', k, '', 0); activeKeys.delete(k); }
        });
      }

      const camZone = document.getElementById('camera-zone');
      let lastTouch = null;
      camZone.addEventListener('touchstart', (e) => { e.preventDefault(); lastTouch = e.touches[0]; });
      camZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const movementX = touch.clientX - lastTouch.clientX;
        const movementY = touch.clientY - lastTouch.clientY;
        
        const canvas = document.getElementById('canvas');
        const mouseEvent = new MouseEvent('mousemove', {
          bubbles: true, cancelable: true, clientX: touch.clientX, clientY: touch.clientY, movementX: movementX, movementY: movementY
        });
        canvas.dispatchEvent(mouseEvent);
        lastTouch = touch;
      });
      camZone.addEventListener('touchend', () => { lastTouch = null; });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Fullscreen error: ${err.message}`);
        });
        document.getElementById('fs-btn').style.display = 'none';
      }
    }
  </script>

  <script src="game_engine.js"></script>
</body>
</html>
